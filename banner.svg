<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Aggressive Bombers</title>
  <desc id="description">A bold charcoal banner with an oversized ivory wordmark, an electric blue and orange forward-motion symbol, and the motto Build with intent.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#202630" stroke-width="1"/>
    </pattern>
    <linearGradient id="field" x1="18" y1="0" x2="1574" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <linearGradient id="blue" x1="1082" y1="138" x2="1416" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A3EEFF"/>
      <stop offset="1" stop-color="#4296FF"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1600" height="560" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="560" fill="url(#field)"/>
    <rect x="930" width="670" height="560" fill="url(#grid)"/>
    <path d="M1000 0H1600V560H1260Z" fill="#142332" opacity=".35"/>
    <path d="M0 0H1600" stroke="#78DBFF" stroke-width="6"/>
    <circle cx="83" cy="71" r="5" fill="#FF9057"/>
    <text x="104" y="78" fill="#A4B0BD" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="4">SOFTWARE PRODUCTS / NIGERIA</text>
    <text x="1518" y="78" fill="#6D8298" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3" text-anchor="end">AB / 01</text>
    <g fill="#F3F1EB" font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-6">
      <text x="76" y="231" font-size="116">AGGRESSIVE</text>
      <text x="73" y="379" font-size="160">BOMBERS<tspan fill="#FF9057">.</tspan></text>
    </g>
    <path d="M1018 438L1454 106" stroke="#294253" stroke-width="1"/>
    <path d="M1063 477L1499 145" stroke="#294253" stroke-width="1"/>
    <path d="M1095 141H1257L1401 285L1257 429H1095L1239 285Z" fill="url(#blue)"/>
    <path d="M1307 141H1377L1521 285L1377 429H1307L1451 285Z" fill="#FF9057"/>
    <path d="M1100 153H1252L1384 285" stroke="#E3F8FF" stroke-width="2" opacity=".5"/>
    <path d="M81 444H1519" stroke="#2B3541"/>
    <text x="81" y="501" fill="#F3F1EB" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BUILD WITH INTENT.</text>
    <text x="1519" y="501" fill="#8295A8" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2" text-anchor="end">AGGRESSIVE-BOMBERS / GITHUB</text>
  </g>
